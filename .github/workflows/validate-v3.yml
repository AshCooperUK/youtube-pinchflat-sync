name: Validate V3

on:
  pull_request:
  push:
    branches:
      - v3-youtube-subscription-downloader
      - v3.0.1-performance-ui

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application dependencies
        run: pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m py_compile app/app.py app/downloader_auth.py app/manage_user.py

      - name: Import application with temporary V3 storage
        env:
          DATA_DIR: /tmp/youtube-subscription-downloader-data
          DOWNLOAD_ROOT: /tmp/youtube-subscription-downloader-media
          APP_URL: http://localhost:8787
          CANONICAL_REDIRECT: "false"
        run: |
          mkdir -p "$DATA_DIR" "$DOWNLOAD_ROOT"
          PYTHONPATH=app python - <<'PY'
          import app
          assert app.VERSION == "3.0.1"
          assert app.YOUTUBE_COOKIE_PATH.name == "youtube-cookies.txt"
          print("Application import OK", app.VERSION)
          PY

      - name: Test cookie upload validator
        run: |
          PYTHONPATH=app python - <<'PY'
          from downloader_auth import validate_netscape_cookie_text
          text = "# Netscape HTTP Cookie File\n#HttpOnly_.youtube.com\tTRUE\t/\tTRUE\t2147483647\tSID\texample\n"
          normalised, stats = validate_netscape_cookie_text(text)
          assert stats["youtube_cookies"] == 1
          assert "#HttpOnly_.youtube.com" in normalised
          print("Cookie validator OK")
          PY

      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          for path in Path("app/templates").glob("*.html"):
              env.parse(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

      - name: Check duplicate literal HTML IDs
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          text = Path("app/templates/index.html").read_text(encoding="utf-8")
          ids = re.findall(r'\bid=["\']([^"\'{%}]+)["\']', text)
          duplicates = {key: value for key, value in Counter(ids).items() if value > 1}
          if duplicates:
              raise SystemExit(f"Duplicate literal IDs: {duplicates}")
          print("No duplicate literal HTML IDs")
          PY

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config >/dev/null
          docker compose -f docker-compose.dev.yml config >/dev/null
          docker compose -f Apps/YouTubePinchflatSync/docker-compose.yml config >/dev/null

      - name: Build application image
        run: docker build -t youtube-subscription-downloader:v3-test ./app


      - name: Stage clean source package
        run: |
          mkdir -p /tmp/v13.0.1
          git archive HEAD | tar -x -C /tmp/v13.0.1

      - name: Upload v13.0.1 source package
        uses: actions/upload-artifact@v4
        with:
          name: v13.0.1
          path: /tmp/v13.0.1
          if-no-files-found: error
          retention-days: 7
