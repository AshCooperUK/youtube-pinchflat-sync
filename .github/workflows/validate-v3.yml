name: Validate V3

on:
  pull_request:
  push:
    branches:
      - v3-youtube-subscription-downloader
      - v3.0.2-performance-codec

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install application dependencies
        run: pip install -r app/requirements.txt

      - name: Compile Python
        run: python -m py_compile app/app.py app/downloader_auth.py app/manage_user.py

      - name: Import application with temporary V3 storage
        env:
          DATA_DIR: /tmp/youtube-subscription-downloader-data
          DOWNLOAD_ROOT: /tmp/youtube-subscription-downloader-media
          APP_URL: http://localhost:8787
          CANONICAL_REDIRECT: "false"
        run: |
          mkdir -p "$DATA_DIR" "$DOWNLOAD_ROOT"
          PYTHONPATH=app python - <<'PY'
          import app
          assert app.VERSION == "3.0.2"
          assert app.YOUTUBE_COOKIE_PATH.name == "youtube-cookies.txt"
          assert app.subscription_download_compatibility_profile() == "emby_tv"
          profile = app._v3_profile_ydl_options("1080p")
          assert "avc1" in profile["format"]
          assert "mp4a" in profile["format"]
          assert profile["merge_output_format"] == "mp4"
          assert callable(app.ensure_download_emby_compatibility)
          print("Application import OK", app.VERSION)
          PY

      - name: Test cookie upload validator
        run: |
          PYTHONPATH=app python - <<'PY'
          from downloader_auth import validate_netscape_cookie_text
          text = "# Netscape HTTP Cookie File\n#HttpOnly_.youtube.com\tTRUE\t/\tTRUE\t2147483647\tSID\texample\n"
          normalised, stats = validate_netscape_cookie_text(text)
          assert stats["youtube_cookies"] == 1
          assert "#HttpOnly_.youtube.com" in normalised
          print("Cookie validator OK")
          PY

      - name: Parse Jinja templates
        run: |
          python - <<'PY'
          from pathlib import Path
          from jinja2 import Environment
          env = Environment()
          for path in Path("app/templates").glob("*.html"):
              env.parse(path.read_text(encoding="utf-8"))
              print("OK", path)
          PY

      - name: Check duplicate literal HTML IDs
        run: |
          python - <<'PY'
          import re
          from collections import Counter
          from pathlib import Path
          text = Path("app/templates/index.html").read_text(encoding="utf-8")
          ids = re.findall(r'\bid=["\']([^"\'{%}]+)["\']', text)
          duplicates = {key: value for key, value in Counter(ids).items() if value > 1}
          if duplicates:
              raise SystemExit(f"Duplicate literal IDs: {duplicates}")
          print("No duplicate literal HTML IDs")
          PY

      - name: Validate compose files
        run: |
          cp .env.example .env
          docker compose -f compose.yaml config >/dev/null
          docker compose -f docker-compose.dev.yml config >/dev/null
          docker compose -f Apps/YouTubePinchflatSync/docker-compose.yml config >/dev/null

      - name: Build application image
        run: docker build -t youtube-subscription-downloader:v3-test ./app


      - name: Verify Direct Play compatibility conversion
        run: |
          docker run --rm --entrypoint sh youtube-subscription-downloader:v3-test -c '
            set -eu
            mkdir -p /tmp/appdata /tmp/media
            ffmpeg -hide_banner -loglevel error -y               -f lavfi -i color=c=blue:s=320x240:d=1               -f lavfi -i sine=frequency=440:duration=1               -c:v mpeg4 -c:a pcm_s16le /tmp/input.avi
            DATA_DIR=/tmp/appdata DOWNLOAD_ROOT=/tmp/media python - <<'"'"'PY'"'"'
import app
out = app.ensure_download_emby_compatibility(
    "/tmp/input.avi",
    compatibility_profile="emby_tv",
)
video, audio = app._probe_single_download_codecs(out)
assert out.endswith(".mp4"), out
assert video == "h264", video
assert audio == "aac", audio
print("Direct Play conversion OK", out, video, audio)
PY
          '

      - name: Stage clean v3.0.2 source package
        run: |
          mkdir -p /tmp/youtube-subscription-downloader-v3.0.2
          git archive HEAD | tar -x -C /tmp/youtube-subscription-downloader-v3.0.2
          rm -rf /tmp/youtube-subscription-downloader-v3.0.2/app/__pycache__

      - name: Upload v3.0.2 source package
        uses: actions/upload-artifact@v4
        with:
          name: youtube-subscription-downloader-v3.0.2
          path: /tmp/youtube-subscription-downloader-v3.0.2
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
