name: youtube-pinchflat-sync

services:
  pinchflat:
    image: ghcr.io/kieraneglin/pinchflat:latest
    container_name: pinchflat
    restart: unless-stopped
    environment:
      TZ: Europe/London
      LOG_LEVEL: info
      UMASK: "022"
    ports:
      - target: 8945
        published: "8945"
        protocol: tcp
    volumes:
      - type: bind
        source: /media/NVME-Storage/AppData/pinchflat
        target: /config
      - type: bind
        source: /media/Storage/Media/YouTube
        target: /downloads
    labels:
      icon: https://cdn.jsdelivr.net/gh/AshCooperUK/youtube-pinchflat-sync@main/Apps/YouTubePinchflatSync/icon.svg
    x-casaos:
      ports:
        - container: "8945"
          description:
            en_US: Pinchflat web interface
      volumes:
        - container: /config
          description:
            en_US: Pinchflat configuration and database
        - container: /downloads
          description:
            en_US: YouTube download library

  youtube-sync:
    image: ghcr.io/ashcooperuk/youtube-pinchflat-sync:latest
    container_name: youtube-pinchflat-sync
    restart: unless-stopped
    depends_on:
      - pinchflat
    environment:
      TZ: Europe/London
      DATA_DIR: /data
      DOWNLOAD_ROOT: /downloads
      APP_URL: "https://youtube.ashjohn.uk"
      GOOGLE_CLIENT_ID: ""
      GOOGLE_CLIENT_SECRET: ""
      GOOGLE_REDIRECT_URI: ""
      CANONICAL_REDIRECT: "true"
      YOUTUBE_SCOPE: https://www.googleapis.com/auth/youtube
      PINCHFLAT_URL: http://butane.grovefarm:8945
      PINCHFLAT_PUBLIC_URL: http://butane.grovefarm:8945
      PINCHFLAT_DB_PATH: /pinchflat-config/db/pinchflat.db
      PINCHFLAT_CONTAINER_NAME: pinchflat
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      PINCHFLAT_MEDIA_PROFILE_ID: "1"
      PINCHFLAT_BASIC_AUTH_USERNAME: ""
      PINCHFLAT_BASIC_AUTH_PASSWORD: ""
      SYNC_INTERVAL_MINUTES: "60"
      INITIAL_IMPORT_CUTOFF: today
      INITIAL_IMPORT_YEARS: "1"
      INITIAL_IMPORT_CUSTOM_DATE: ""
      MAX_NEW_SOURCES_PER_RUN: "0"
      ADD_DELAY_SECONDS: "2"
      DRY_RUN: "false"
    ports:
      - target: 8787
        published: "8787"
        protocol: tcp
    volumes:
      - type: bind
        source: /media/NVME-Storage/AppData/youtube-pinchflat-sync/data
        target: /data
      - type: bind
        source: /media/Storage/Media/YouTube
        target: /downloads
      - type: bind
        source: /media/NVME-Storage/AppData/pinchflat
        target: /pinchflat-config
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    labels:
      icon: https://cdn.jsdelivr.net/gh/AshCooperUK/youtube-pinchflat-sync@main/Apps/YouTubePinchflatSync/icon.svg
    x-casaos:
      ports:
        - container: "8787"
          description:
            en_US: Pinchflat Sync dashboard
      volumes:
        - container: /data
          description:
            en_US: OAuth token, settings and subscription database
        - container: /downloads
          description:
            en_US: Shared YouTube media library used for storage statistics and direct downloads
        - container: /pinchflat-config
          description:
            en_US: Read-only Pinchflat database used to reconcile removed sources
        - container: /var/run/docker.sock
          description:
            en_US: Docker Engine control for Pinchflat start, stop and direct source cleanup
      envs:
        - container: APP_URL
          description:
            en_US: Canonical public URL used for Google OAuth and browser access
        - container: CANONICAL_REDIRECT
          description:
            en_US: Redirect the local ZimaOS tile URL to APP_URL when true
        - container: TZ
          description:
            en_US: Time zone
        - container: PINCHFLAT_URL
          description:
            en_US: Internal Pinchflat URL
        - container: PINCHFLAT_CONTAINER_NAME
          description:
            en_US: Docker container name controlled by the Pinchflat power switch
        - container: DOCKER_SOCKET_PATH
          description:
            en_US: Docker Engine Unix socket path
        - container: PINCHFLAT_PUBLIC_URL
          description:
            en_US: Browser URL used by the Open Pinchflat button
        - container: SYNC_INTERVAL_MINUTES
          description:
            en_US: Initial default interval for the separate YouTube and Pinchflat automation schedules
        - container: MAX_NEW_SOURCES_PER_RUN
          description:
            en_US: Maximum new Pinchflat sources per run. 0 means unlimited
        - container: DRY_RUN
          description:
            en_US: Set true to preview without creating Pinchflat sources

x-casaos:
  id: uk.ashjohn.youtube-pinchflat-sync
  store_app_id: youtube-pinchflat-sync
  main: youtube-sync
  index: /
  port_map: "8787"
  scheme: http
  icon: https://cdn.jsdelivr.net/gh/AshCooperUK/youtube-pinchflat-sync@main/Apps/YouTubePinchflatSync/icon.svg
  title:
    en_US: Pinchflat Sync
  tagline:
    en_US: Sync your YouTube subscriptions into Pinchflat automatically.
  description:
    en_US: Reads your YouTube subscriptions with Google OAuth and lets each source have its own Pinchflat download cutoff.
  author: AshCooperUK
  developer: AshCooperUK
  category: Media
  architectures:
    - amd64
    - arm64
  version: "2.9.1"
  update_at: "2026-09-13"
  release_notes:
    en_US: v2.6 streamlines source control, moves favourites and logs into Settings, expands Pinchflat profile editing, improves one-time downloads, and adds Subscribe controls to in-app video playback.
  website: https://github.com/AshCooperUK/youtube-pinchflat-sync
  repo: https://github.com/AshCooperUK/youtube-pinchflat-sync
  support: https://github.com/AshCooperUK/youtube-pinchflat-sync/issues
  docs: https://github.com/AshCooperUK/youtube-pinchflat-sync#readme
